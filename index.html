<!-- ====================================================================
     THE ONE INLINE SCRIPT.

     This runs before the body parses, and that is the entire reason it is
     here rather than in js/. A deferred script, or anything at the foot of
     the body, is by definition too late to prevent a flash of the wrong
     theme or the wrong mode. These few lines are not worth a blocking
     request of their own.
     ==================================================================== -->
<script>
(function () {
    try {
        var theme = localStorage.getItem('theme');
        if (theme === 'dark' || theme === 'light') {
            document.documentElement.setAttribute('data-theme', theme);
        }
        var mode = localStorage.getItem('springdeck:mode');
        if (mode) document.documentElement.dataset.mode = mode;

        // Only when there is no hash to honour. A shared link always wins
        // over wherever this particular browser happened to be last.
        if (!location.hash && mode) {
            var last = JSON.parse(localStorage.getItem('springdeck:mode:last') || '{}');
            location.replace(last[mode] || ('#' + mode));
        }
    } catch (e) {
        // Private mode, file:// in some browsers, or a hand-edited value.
        // The defaults are fine and the page must not break over a
        // convenience feature.
    }
})();
</script>

<!-- js: leaves first, app.js last.

     code-highlight.js, diagrams.js and progress.js are leaves: they declare a
     global and call nothing. navigation.js calls topicById() from data, which
     is above it, and calls the mode handlers, which are below it — the
     forward reference is safe because dispatch only ever runs from start() or
     from a hashchange, both of which happen after app.js has registered.

     theory.js sits between them because it registers its own route handler at
     parse time and app.js is what calls router.start(). A mode is therefore a
     file and a script tag, and app.js never learns the names of the other
     four.

     search-index.js is a leaf and sits with the other leaves: it declares
     pure functions over the corpora and touches no DOM, which is what lets
     tools/validate-search.js load it into a vm and check it in Node.
     glossary.js reads glossaryTermSlug from it, so it has to be above.

     search.js is last but one. It calls router.go and reads modeById, and it
     is bound from DOMContentLoaded — registered before app.js's listener,
     which is what puts its router.onAny in place before router.start(). -->
