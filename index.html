<!-- Inline SVG favicon as a data URI: no network request, and it survives
     file:// where a relative icon path often does not. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%236DB33F'/%3E%3Cpath d='M9 22c0-7 5-12 14-13 0 9-5 14-14 13z' fill='%23fff'/%3E%3Cpath d='M11 23c3-5 6-7 10-9' stroke='%236DB33F' stroke-width='1.6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">

<!-- ====================================================================
     THE ONE INLINE SCRIPT.

     This runs before the body parses, and that is the entire reason it is
     here rather than in js/. A deferred script, or anything at the foot of
     the body, is by definition too late to prevent a flash of the wrong
     theme or the wrong mode. These few lines are not worth a blocking
     request of their own.
     ==================================================================== -->
<script>
(function () {
    try {
        var theme = localStorage.getItem('theme');
        if (theme === 'dark' || theme === 'light') {
            document.documentElement.setAttribute('data-theme', theme);
        }
        var mode = localStorage.getItem('springdeck:mode');
        if (mode) document.documentElement.dataset.mode = mode;

        // Only when there is no hash to honour. A shared link always wins
        // over wherever this particular browser happened to be last.
        if (!location.hash && mode) {
            var last = JSON.parse(localStorage.getItem('springdeck:mode:last') || '{}');
            location.replace(last[mode] || ('#' + mode));
        }
    } catch (e) {
        // Private mode, file:// in some browsers, or a hand-edited value.
        // The defaults are fine and the page must not break over a
        // convenience feature.
    }
})();
</script>

            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
    </div>
</nav>

<header class="mode-header" role="banner">
    <button class="hamburger" id="hamburger" type="button" aria-label="Open navigation" aria-expanded="false" aria-controls="sidebarNav">

        <div class="search-results" id="searchResults" role="listbox" aria-label="Search results"></div>

</header>

<!-- ====================================================================
     LOAD ORDER IS THE DEPENDENCY GRAPH.

     There are no imports. This order IS the dependency declaration, and
     forward references across it are pervasive and safe: navigation.js
     calls renderers defined below it, rail.js calls renderSidebar from
     sidebar.js, progress.js reads collectGlossaryEntries from glossary.js.
     Every one of them runs from an event handler or from initApp(), long
     after the last script has been parsed.

     DO NOT REORDER TO "FIX" THIS.

     The three CDN tags are optional and decorative. Blocking all of them
     costs the reader nothing but a particle background and a stagger.
     ==================================================================== -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

<!-- data: one global per file, then the registries that assemble them -->
<script src="data/java-language.js"></script>
<script src="data/collections.js"></script>
<script src="data/concurrency.js"></script>
<script src="data/spring-core.js"></script>
<script src="data/index.js"></script>

<!-- js: leaves first, app.js last.

     code-highlight.js, diagrams.js and progress.js are leaves: they declare a
     global and call nothing. navigation.js calls topicById() from data, which
     is above it, and calls the mode handlers, which are below it — the
     forward reference is safe because dispatch only ever runs from start() or
     from a hashchange, both of which happen after app.js has registered. -->
<script src="js/theme.js"></script>
<script src="js/three-bg.js"></script>
<script src="js/code-highlight.js"></script>
<script src="js/diagrams.js"></script>
<script src="js/progress.js"></script>
<script src="js/navigation.js"></script>
<script src="js/app.js"></script>
